<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domotique Control - Hub d'accueil</title>
    <!-- Tailwind CSS pour la mise en page et le style -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Styles personnalisés pour animations et effets */
        body {
            background-color: #eef2f6; /* Fond gris doux et moderne */
        }
        
        .section-card {
            background-color: #ffffff; /* Couleur identique pour toutes les sections */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        /* Effet de pulsation pour l'indicateur d'état */
        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>
<body>
    <div id="sections-container" class="space-y-2">

            <!-- 1. Connexion au serveur domotique -->
            <div class="section-card rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm hover:border-brand-500/40 cursor-pointer" onclick="handleCardClick('Connexion au serveur domotique')">

                        </div>
                        <!-- Texte & Description -->
